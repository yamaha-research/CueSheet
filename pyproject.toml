[project]
name = "cuesheet"
version = "0.1.0"
description = "CueSheet: multi-genre concert segment detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "transformers>=4.40",
    "librosa>=0.10",
    "numpy",
    "pandas",
    "scikit-learn",
    "pytorch-lightning>=2.2",
    "pytorch-crf",
    "hmmlearn",
    "pyyaml",
    "tqdm",
    "matplotlib",
    "pytubefix>=10.6.1",
    "panns-inference>=0.1.1",
    "pillow>=12.2.0",
    "gdown>=6.0.0",
    "torchlibrosa>=0.1.0",
    "fastapi>=0.136.1",
    "uvicorn>=0.47.0",
    "python-multipart>=0.0.29",
    "websockets>=16.0",
    "httpx>=0.27.0",
    "sounddevice>=0.5.5",
    "soundfile>=0.12.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The src/ tree is installed as the importable `src.*` package by hatchling.
packages = ["cuesheet/src"]

[tool.ruff]
line-length = 100
target-version = "py311"
